<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #dbeafe, #67e8f9);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.92);
        width: 100%;
        max-width: 400px;
        padding: 30px;
        border-radius: 22px;
        text-align: center;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.7);
      }

      h1 {
        margin-bottom: 22px;
        color: #0f172a;
        font-size: 30px;
        letter-spacing: -0.5px;
      }

      .search-box {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        padding: 13px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        outline: none;
        font-size: 15px;
        transition: 0.2s ease;
      }

      input:focus {
        border-color: #0284c7;
        box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.14);
      }

      button {
        padding: 12px 18px;
        border: none;
        background: #0284c7;
        color: white;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s ease;
      }

      button:hover {
        background: #0369a1;
        transform: translateY(-1px);
      }

      .weather-box {
        margin-top: 30px;
        padding: 22px;
        border-radius: 18px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
      }

      .weather-box h1 {
        font-size: 52px;
        margin: 12px 0;
        color: #0284c7;
      }

      .weather-box h2 {
        color: #0f172a;
        font-size: 24px;
      }

      .weather-box h3 {
        margin-bottom: 10px;
        color: #334155;
      }

      .weather-box p {
        color: #475569;
        font-size: 16px;
      }

      @media (max-width: 480px) {
        .search-box {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Weather app</h1>
      <div class="search-box">
        <input type="text" placeholder="Enter City Name" id="city" />
        <button onclick="getWeather()">Search</button>
      </div>

      <div class="weather-box" id="weatherBox">
        <h2 id="cityName"></h2>
        <h1 id="temp"></h1>
        <h3 id="condition"></h3>
        <p id="humidity"></p>
      </div>
    </div>
    <script>
      var apiKey = "466ddaa21a8de191e9f608bd11a56acb";
      async function getWeather() {
        var city = document.getElementById("city").value;
        var url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

        try {
          var response = await fetch(url);
          var data = await response.json();
          console.log(data);
          document.getElementById("cityName").innerHTML = data.name;
          document.getElementById("temp").innerHTML = data.main.temp + "°C";
          document.getElementById("condition").innerHTML = data.weather[0].main;
          document.getElementById("humidity").innerHTML = "Humidity : " + data.main.humidity + "%";
        } catch (error) {
          alert("City not found");
        }
      }
    </script>
  </body>
</html>
